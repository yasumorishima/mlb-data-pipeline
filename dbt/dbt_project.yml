name: mlb_marts
version: "0.1.0"
config-version: 2
profile: mlb_marts

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Where the raw parquet files live. Default = the public Hugging Face dataset
  # this repo publishes; point it at a local folder to build offline:
  #   dbt build --vars "{raw_base: /path/to/parquet}"
  raw_base: "https://huggingface.co/datasets/yasumorishima/mlb-stats/resolve/main"

models:
  mlb_marts:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
    bi:
      +materialized: table

seeds:
  mlb_marts:
    mlb_teams:
      # Fixed types so both adapters load the same table.
      +column_types:
        team_id: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        team_abbr: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        team_name: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        league: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        division: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"

flags:
  send_anonymous_usage_stats: false
