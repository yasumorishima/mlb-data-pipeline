name: dbt Marts

# Builds the analysis marts in dbt/ straight from the public Hugging Face
# dataset (DuckDB reads the parquet over HTTPS, nothing to download first)
# and runs every data test. Triggers: changes to dbt/, and each completed
# weekly refresh, so a bad upstream table is caught the week it lands.

on:
  pull_request:
    paths: ["dbt/**", ".github/workflows/dbt_marts.yml"]
  push:
    branches: [master]
    paths: ["dbt/**", ".github/workflows/dbt_marts.yml"]
  workflow_run:
    workflows: ["Weekly Data Refresh"]
    types: [completed]
  workflow_dispatch:
    inputs:
      memo:
        description: "Execution intent (required for manual runs)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    # After a refresh, only build when the refresh itself succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # Job-level, so a skipped job (failed refresh) never takes a place in the
    # queue. One group per ref: master runs (push, post-refresh, master
    # dispatch) run one at a time and a running one is never cancelled, so an
    # upload is never cut off. GitHub keeps only the newest pending run per
    # group, which is the one with the latest code and data. Pull requests
    # cancel their own stale runs.
    concurrency:
      group: dbt-marts-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      revision: ${{ steps.rev.outputs.sha }}
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: dbt/requirements.txt

      - name: Install dbt
        run: pip install -r requirements.txt

      # Pin the input to the dataset commit that is current now, so the
      # build reads one consistent snapshot and the manifest can name it.
      - name: Resolve the dataset revision
        id: rev
        run: |
          sha=$(curl --fail --max-time 30 -sS https://huggingface.co/api/datasets/yasumorishima/mlb-stats/revision/main | jq -r .sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "bad revision: $sha"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "reading yasumorishima/mlb-stats@$sha"

      - name: dbt build (models + tests)
        run: >-
          dbt build --profiles-dir .
          --vars '{raw_base: "https://huggingface.co/datasets/yasumorishima/mlb-stats/resolve/${{ steps.rev.outputs.sha }}"}'

      # Publish only from master, and only after every model and data test
      # above passed (a failed step skips everything below). export_marts.py
      # refuses a missing, empty or unexpected mart.
      - name: Export marts to parquet
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          INPUT_REVISION: ${{ steps.rev.outputs.sha }}
        run: python export_marts.py target/mlb.duckdb ../publish/marts

      - name: Publish marts to Hugging Face
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        working-directory: .
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # `hf` ships with huggingface_hub 0.34. Below 2.0 a folder upload
          # is one commit by contract (2.x may split large folders).
          pip install --quiet "huggingface_hub>=0.34,<2"
          shopt -s nullglob
          marts=(publish/marts/*.parquet)
          if [ "${#marts[@]}" -eq 0 ]; then
            echo "no marts exported"
            exit 1
          fi
          # One commit for the marts, their manifest and the card that lists
          # them, so readers never see a mix of old and new files.
          cp docs/hf_dataset_card.md publish/README.md
          hf upload yasumorishima/mlb-stats publish . \
            --repo-type dataset \
            --commit-message "dbt marts ($GITHUB_SHA)"
          echo "Published ${#marts[@]} marts"

  # The same models on BigQuery, in a sandbox project with no billing account
  # (free: 10 GB storage, 1 TB queries a month; tables expire after 60 days,
  # so the weekly rebuild keeps them alive). Runs only after the DuckDB build
  # above passed every test, and reads the same dataset revision. No key is
  # stored: GitHub's OIDC token is exchanged through Workload Identity
  # Federation, whose provider accepts only this repository's master branch.
  bigquery:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    concurrency:
      group: dbt-marts-bigquery
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: dbt/requirements-bigquery.txt

      - name: Install dbt-bigquery
        run: pip install -r requirements-bigquery.txt

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/553963650152/locations/global/workloadIdentityPools/github/providers/mlb-data-pipeline
          service_account: dbt-gha@mlb-marts-sandbox.iam.gserviceaccount.com

      - name: Load the raw tables into BigQuery
        run: python load_raw_bigquery.py "${{ needs.build.outputs.revision }}"

      - name: dbt build on BigQuery (models + tests)
        run: dbt build --profiles-dir . --target bigquery
