name: dbt Marts

# Builds the analysis marts in dbt/ straight from the public Hugging Face
# dataset (DuckDB reads the parquet over HTTPS, nothing to download first)
# and runs every data test. Triggers: changes to dbt/, and each completed
# weekly refresh, so a bad upstream table is caught the week it lands.

on:
  pull_request:
    paths: ["dbt/**", ".github/workflows/dbt_marts.yml"]
  push:
    branches: [master]
    paths: ["dbt/**", ".github/workflows/dbt_marts.yml"]
  workflow_run:
    workflows: ["Weekly Data Refresh"]
    types: [completed]
  workflow_dispatch:
    inputs:
      memo:
        description: "Execution intent (required for manual runs)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # event_name keeps a push to master from cancelling a post-refresh check.
  group: dbt-marts-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # After a refresh, only build when the refresh itself succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: dbt/requirements.txt

      - name: Install dbt
        run: pip install -r requirements.txt

      - name: dbt build (models + tests)
        run: dbt build --profiles-dir .

      # Publish only from master, and only after every model and data test
      # above passed (a failed step skips everything below). export_marts.py
      # refuses a missing, empty or unexpected mart.
      - name: Export marts to parquet
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: python export_marts.py target/mlb.duckdb ../marts_out

      - name: Publish marts to Hugging Face
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        working-directory: .
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install --quiet "huggingface_hub>=0.26"
          count=0
          for f in marts_out/*.parquet; do
            base="$(basename "$f")"
            hf upload yasumorishima/mlb-stats "$f" "marts/$base" \
              --repo-type dataset \
              --commit-message "dbt marts: $base"
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            echo "no marts exported"
            exit 1
          fi
          # The card lists the marts as viewer configs, so ship it with them.
          hf upload yasumorishima/mlb-stats docs/hf_dataset_card.md README.md \
            --repo-type dataset \
            --commit-message "Update dataset card"
          echo "Published $count marts"
