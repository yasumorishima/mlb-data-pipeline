name: Weekly Data Refresh

on:
  schedule:
    # Every Monday UTC 01:00 (JST 10:00)
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      memo:
        description: "Execution intent (required for manual runs)"
        required: true
        type: string
      steps:
        description: "Comma-separated steps to run (default: all)"
        required: false
        type: string
        default: "all"
      start_year:
        description: "Start year override"
        required: false
        type: string
        default: "2015"
      end_year:
        description: "End year override (default: latest season past opening day)"
        required: false
        type: string
        default: ""
      allow_statsapi_shrink:
        description: "Publish statsapi_* even if a completed season lost players (check the ids first)"
        required: false
        type: boolean
        default: false

# Storage: data is written as local Parquet then pushed to the public
# Hugging Face dataset yasumorishima/mlb-stats (BigQuery retired 2026-04-19,
# RPi5 SSD retired 2026-05-29 -> HF is the canonical store). No GCP needed.
#
# Known limitation: the FanGraphs tables (fg_batting / fg_pitching /
# fg_pitcher_plus) return 403 from this runner. That step is
# continue-on-error so the Savant tables still refresh weekly; the fg_*
# files on HF remain the 2026-04 rescued snapshot, which ends with the
# 2025 season. scripts/check_outputs.py reports them every run and the
# exemption expires, so this cannot quietly become permanent.
#
# The cause is the address, not the client: pybaseball sets no
# User-Agent, so it sends the honest python-requests default, and it
# still got 403 for all 12 seasons on run 35565978836 (2026-09-21). The
# same request from a residential line returns 200 (measured
# 2026-09-23). park_factors is no longer a FanGraphs table - it moved to
# Baseball Savant in savant-extras 0.5.0 - so it refreshes weekly like
# the rest and its step is not excused.
permissions:
  contents: read
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MLB_DATA_TARGET: parquet
      MLB_PARQUET_ROOT: ${{ github.workspace }}/data/parquet_out
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine steps
        id: steps
        env:
          END_YEAR_INPUT: ${{ inputs.end_year }}
        run: |
          STEPS="${{ inputs.steps || 'all' }}"
          echo "steps=$STEPS" >> $GITHUB_OUTPUT
          echo "Running steps: $STEPS"
          # The end year used to default to a literal '2026' in every step,
          # so from 2027 the weekly job would have kept refreshing through
          # 2026 and stayed green while the new season never arrived.
          # "This calendar year" is wrong too: before opening day the new
          # season has no rows (the Stats API returns 0 splits), and every
          # fetch that checks its year range would fail each January to
          # March. So default to the latest season whose regular season
          # has started, read from the Stats API. No fallback guess: if
          # that cannot be read, stop here.
          END_YEAR="$END_YEAR_INPUT"
          if [ -z "$END_YEAR" ]; then
            YEAR="$(date -u +%Y)"
            TODAY="$(date -u +%F)"
            START="$(curl --max-time 30 -fsS \
              "https://statsapi.mlb.com/api/v1/seasons/${YEAR}?sportId=1" \
              | jq -r '.seasons[0].regularSeasonStartDate // empty')"
            case "$START" in
              [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
              *) echo "Could not read the ${YEAR} opening day (got '$START')"; exit 1 ;;
            esac
            if [[ "$TODAY" < "$START" ]]; then
              END_YEAR=$((YEAR - 1))
            else
              END_YEAR="$YEAR"
            fi
            echo "Opening day ${YEAR}: ${START}; today ${TODAY}"
          fi
          case "$END_YEAR" in
            [0-9][0-9][0-9][0-9]) ;;
            *) echo "end_year must be a 4-digit year, got '$END_YEAR'"; exit 1 ;;
          esac
          echo "end_year=$END_YEAR" >> $GITHUB_OUTPUT
          echo "End year: $END_YEAR"

      # ================================================================
      # FanGraphs (batting + pitching + pitcher plus)
      # continue-on-error: FanGraphs 403s datacenter IPs (see header note)
      # ================================================================
      - name: Fetch FanGraphs
        if: contains(steps.steps.outputs.steps, 'all') || contains(steps.steps.outputs.steps, 'fangraphs')
        continue-on-error: true
        working-directory: scripts
        run: |
          python fetch_fangraphs.py \
            --start-year ${{ inputs.start_year || '2015' }} \
            --end-year ${{ steps.steps.outputs.end_year }}

      # ================================================================
      # Savant leaderboards (exit velo, expected, bat tracking, etc.)
      # ================================================================
      - name: Fetch Savant leaderboards
        if: contains(steps.steps.outputs.steps, 'all') || contains(steps.steps.outputs.steps, 'savant')
        working-directory: scripts
        run: |
          python fetch_savant_leaderboards.py \
            --start-year ${{ inputs.start_year || '2015' }} \
            --end-year ${{ steps.steps.outputs.end_year }}

      # ================================================================
      # Fielding + running (sprint speed, OAA, catcher)
      # ================================================================
      - name: Fetch fielding/running
        if: contains(steps.steps.outputs.steps, 'all') || contains(steps.steps.outputs.steps, 'fielding')
        working-directory: scripts
        run: |
          python fetch_fielding_running.py \
            --start-year ${{ inputs.start_year || '2015' }} \
            --end-year ${{ steps.steps.outputs.end_year }}

      # ================================================================
      # Park factors (Baseball Savant statcast-park-factors)
      # Not continue-on-error: savant-extras 0.5.0 moved this off
      # FanGraphs, so a failure here is a real failure. While it was
      # excused, park_factors never reached the dataset at all.
      # ================================================================
      - name: Fetch park factors
        if: contains(steps.steps.outputs.steps, 'all') || contains(steps.steps.outputs.steps, 'park')
        working-directory: scripts
        run: |
          python fetch_park_factors.py \
            --start-year ${{ inputs.start_year || '2015' }} \
            --end-year ${{ steps.steps.outputs.end_year }}

      # ================================================================
      # MLB Stats API season + sabermetrics (statsapi_batting / _pitching)
      # Keyless and reachable from this runner, so not continue-on-error.
      # The step is called "statsapi", not "stats": contains() is a
      # substring match and "stats" would also select "statcast".
      # Its tests run first so a broken gate cannot publish.
      # ================================================================
      - name: Fetch MLB Stats API
        if: contains(steps.steps.outputs.steps, 'all') || contains(steps.steps.outputs.steps, 'statsapi')
        working-directory: scripts
        env:
          ALLOW_SHRINK: ${{ inputs.allow_statsapi_shrink }}
        run: |
          python ../tests/test_fetch_statsapi.py
          EXTRA=""
          if [ "$ALLOW_SHRINK" = "true" ]; then
            EXTRA="--allow-shrink"
          fi
          python fetch_statsapi.py \
            --start-year ${{ inputs.start_year || '2015' }} \
            --end-year ${{ steps.steps.outputs.end_year }} $EXTRA

      # ================================================================
      # Statcast pitch-level data (heavy - manual trigger only)
      # ================================================================
      - name: Fetch Statcast pitches
        if: contains(steps.steps.outputs.steps, 'statcast')
        working-directory: scripts
        run: |
          python fetch_statcast_pitches.py \
            --years "${{ inputs.start_year || '2024' }}-${{ inputs.end_year || '2024' }}"

      # ================================================================
      # List parquet outputs (diagnostic, always runs)
      # ================================================================
      - name: List parquet outputs
        if: always()
        run: |
          echo "Parquet outputs under data/parquet_out:"
          find data/parquet_out -name '*.parquet' -printf '%10s  %p\n' 2>/dev/null || true

      # ================================================================
      # Did every table this run asked for actually arrive?
      #
      # The upload step pushes whatever files exist, so a table that
      # fetched nothing is simply skipped and Hugging Face keeps the old
      # copy - green job, silently stale table. This step says what was
      # produced and fails when an expected table is missing or empty.
      # Its own tests run first so a broken check cannot pass by being
      # broken.
      # ================================================================
      - name: Test the output audit
        id: audit_tests
        if: always()
        run: python tests/test_check_outputs.py

      - name: Audit outputs
        id: audit
        if: always()
        # continue-on-error so the tables that ARE fine still get
        # uploaded; the last step in the job turns the run red.
        continue-on-error: true
        run: |
          python scripts/check_outputs.py \
            --steps "${{ steps.steps.outputs.steps }}" \
            --ok-list ok_tables.txt

      # ================================================================
      # Upload to Hugging Face (public dataset, flattened to root to
      # match existing layout: <table>/<table>.parquet -> <table>.parquet)
      # ================================================================
      # A step with no `if:` carries the implicit success(), so a failed
      # fetch step would skip both uploads and cost the week for every
      # table that did arrive. Publish whenever the audit actually ran
      # and its own tests passed; a broken gate still blocks publishing.
      - name: Install huggingface_hub
        if: >-
          !cancelled()
          && steps.audit_tests.outcome == 'success'
          && steps.audit.outcome != 'skipped'
        run: pip install --quiet "huggingface_hub>=0.26"

      - name: Upload to Hugging Face
        if: >-
          !cancelled()
          && steps.audit_tests.outcome == 'success'
          && steps.audit.outcome != 'skipped'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          shopt -s nullglob
          # Only the tables the audit passed. Uploading a table it
          # rejected would overwrite a good copy on Hugging Face with an
          # empty or truncated one.
          if [ ! -f ok_tables.txt ]; then
            echo "ok_tables.txt is missing — the audit step did not run"
            exit 1
          fi
          count=0
          while read -r table; do
            [ -n "$table" ] || continue
            for f in data/parquet_out/"$table"/"$table"*.parquet; do
              base="$(basename "$f")"
              echo "Uploading $f -> $base"
              hf upload yasumorishima/mlb-stats "$f" "$base" \
                --repo-type dataset \
                --commit-message "Weekly refresh: $base"
              count=$((count + 1))
            done
          done < ok_tables.txt
          echo "Uploaded $count parquet file(s) to yasumorishima/mlb-stats"
          if [ "$count" -eq 0 ]; then
            echo "No parquet files produced — failing so the issue is visible"
            exit 1
          fi

          # The dataset card lives in this repo so it cannot drift from the
          # pipeline, and ships from the same job that ships the data.
          # tests/test_check_outputs.py fails if it stops naming a table.
          hf upload yasumorishima/mlb-stats docs/hf_dataset_card.md README.md             --repo-type dataset             --commit-message "Update dataset card"
          echo "Updated the dataset card"

      # ================================================================
      # The audit ran with continue-on-error so the healthy tables could
      # still be published. Turn the run red here, after the upload, so
      # a single missing table costs visibility and not the whole week.
      # ================================================================
      - name: Fail if the audit found a problem
        if: always() && steps.audit.outcome == 'failure'
        run: |
          echo "The output audit reported a missing, empty or unreadable table."
          echo "See the job summary. The tables that were fine have been"
          echo "uploaded; this run is red so the gap is visible."
          exit 1

      # ================================================================
      # Discord notification
      # ================================================================
      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "no webhook configured"
            exit 0
          fi
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
          else
            EMOJI="❌"
          fi
          curl -sS -w "\nHTTP %{http_code}\n" -H "Content-Type: application/json" \
            -d "{\"content\": \"${EMOJI} **mlb-data-pipeline** weekly refresh -> HF mlb-stats: ${STATUS}\"}" \
            "$DISCORD_WEBHOOK_URL"

      # ================================================================
      # Keep the schedule alive
      # ================================================================
      # GitHub disables scheduled workflows after 60 days without repository
      # activity. This job only uploads to Hugging Face and never commits, so
      # the timer never resets on its own. Re-asserting "enabled" every run
      # keeps the cron alive (same approach as wbc-scouting/keepalive.yml,
      # which has survived 75+ days without a push).
      - name: Keep workflow enabled (reset 60-day inactivity timer)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/weekly_refresh.yml/enable"
